<title>Gitar Gamları</title>
<style>
  /* Tek sütun: seçim butonları üstte, klavye altta */
  :root {
    --bg: #f3f5f7; --fg: #1d2329; --muted: #5a6570; --btn: #ffffff; --line: #b8c0c8;
    --wood: #b5865a; --fret: #8f9aa3; --nut: #1d2329; --inlay: #e7d8bf; --str: #2b2b2b;
    --root: #d64541; --note: #2f6fb3;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15191d; --fg: #e6eaee; --muted: #9aa5b0; --btn: #222a31; --line: #3a444e;
    --wood: #7a5636; --fret: #b9c2ca; --nut: #e6eaee; --inlay: #a98c68; --str: #d8d8d8;
    --root: #e85d58; --note: #4a8fd6; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #15191d; --fg: #e6eaee; --muted: #9aa5b0; --btn: #222a31; --line: #3a444e;
    --wood: #7a5636; --fret: #b9c2ca; --nut: #e6eaee; --inlay: #a98c68; --str: #d8d8d8;
    --root: #e85d58; --note: #4a8fd6; color-scheme: dark }
  body { font-family: sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .row span { width: 70px; font-weight: bold; align-self: center; }
  button { padding: 6px 12px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); border-radius: 4px; cursor: pointer; }
  button.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #title { font-size: 20px; margin: 18px 0 4px; }
  #notes { margin-bottom: 12px; color: var(--muted); }
  .board { overflow-x: auto; }
  .legend { margin-top: 10px; font-size: 14px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 12px; }
  .root { fill: var(--root); background: var(--root); }
  .note { fill: var(--note); background: var(--note); }
  .wood { fill: var(--wood); } .inlay { fill: var(--inlay); }
  .fret { stroke: var(--fret); } .nut { stroke: var(--nut); } .str { stroke: var(--str); }
  .num { fill: var(--muted); } .lbl { fill: #fff; }
</style>
  <h1>Gitar Gamları ve Modları</h1>

  <div class="row" id="roots"><span>Nota:</span></div>
  <div class="row" id="scales"><span>Gam:</span></div>

  <div id="title"></div>
  <div id="notes"></div>
  <div class="board"><svg id="fretboard"></svg></div>
  <div class="legend">
    <span class="dot root"></span>Kök nota
    <span class="dot note"></span>Gamdaki diğer notalar
  </div>

<script>
  const NOTES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];

  // Her gamın kök notaya göre aralıkları (yarım ses cinsinden)
  const SCALES = {
    "Majör (İyonyen)":  [0, 2, 4, 5, 7, 9, 11],
    "Minör (Eolyen)":   [0, 2, 3, 5, 7, 8, 10],
    "Doryen":           [0, 2, 3, 5, 7, 9, 10],
    "Frigyen":          [0, 1, 3, 5, 7, 8, 10],
    "Lidyen":           [0, 2, 4, 6, 7, 9, 11],
    "Miksolidyen":      [0, 2, 4, 5, 7, 9, 10],
    "Lokriyen":         [0, 1, 3, 5, 6, 8, 10],
    "Pentatonik Majör": [0, 2, 4, 7, 9],
    "Pentatonik Minör": [0, 3, 5, 7, 10],
    "Armonik Minör":    [0, 2, 3, 5, 7, 8, 11],
  };

  // Açık teller (üstten alta: ince Mi'den kalın Mi'ye), nota indeksleri
  const STRINGS = [4, 11, 7, 2, 9, 4]; // Mi, Si, Sol, Re, La, Mi
  const FRETS = 15;

  let root = 9;                  // La
  let scale = "Minör (Eolyen)";  // La minör ile başla

  function makeButtons() {
    const rootsDiv = document.getElementById("roots");
    NOTES.forEach((n, i) => {
      const b = document.createElement("button");
      b.textContent = n;
      b.onclick = () => { root = i; draw(); };
      b.dataset.root = i;
      rootsDiv.appendChild(b);
    });
    const scalesDiv = document.getElementById("scales");
    Object.keys(SCALES).forEach(name => {
      const b = document.createElement("button");
      b.textContent = name;
      b.onclick = () => { scale = name; draw(); };
      b.dataset.scale = name;
      scalesDiv.appendChild(b);
    });
  }

  function draw() {
    // Aktif butonları işaretle
    document.querySelectorAll("#roots button").forEach(b => b.classList.toggle("active", +b.dataset.root === root));
    document.querySelectorAll("#scales button").forEach(b => b.classList.toggle("active", b.dataset.scale === scale));

    const scaleNotes = SCALES[scale].map(i => (root + i) % 12);
    document.getElementById("title").textContent = NOTES[root] + " " + scale;
    document.getElementById("notes").textContent = "Notalar: " + scaleNotes.map(n => NOTES[n]).join(" – ");

    const fretW = 60, strGap = 32, left = 50, top = 30;
    const width = left + fretW * FRETS + 20;
    const height = top + strGap * 5 + 40;
    let svg = "";

    // Klavye zemini
    svg += `<rect x="${left}" y="${top - 10}" width="${fretW * FRETS}" height="${strGap * 5 + 20}" class="wood"/>`;

    // Perde işaretleri (3, 5, 7, 9, 12, 15)
    [3, 5, 7, 9, 15].forEach(f => {
      if (f <= FRETS) svg += `<circle cx="${left + fretW * (f - 0.5)}" cy="${top + strGap * 2.5}" r="7" class="inlay"/>`;
    });
    if (FRETS >= 12) {
      svg += `<circle cx="${left + fretW * 11.5}" cy="${top + strGap * 1.5}" r="7" class="inlay"/>`;
      svg += `<circle cx="${left + fretW * 11.5}" cy="${top + strGap * 3.5}" r="7" class="inlay"/>`;
    }

    // Perde telleri ve numaraları
    for (let f = 0; f <= FRETS; f++) {
      const x = left + fretW * f;
      svg += `<line x1="${x}" y1="${top - 10}" x2="${x}" y2="${top + strGap * 5 + 10}" class="${f === 0 ? 'nut' : 'fret'}" stroke-width="${f === 0 ? 6 : 2}"/>`;
      if (f > 0) svg += `<text x="${x - fretW / 2}" y="${height - 5}" text-anchor="middle" font-size="12" class="num">${f}</text>`;
    }

    // Teller
    STRINGS.forEach((open, s) => {
      const y = top + strGap * s;
      svg += `<line x1="${left}" y1="${y}" x2="${left + fretW * FRETS}" y2="${y}" class="str" stroke-width="${1 + s * 0.4}"/>`;

      // Her perdedeki notayı kontrol et (0 = açık tel)
      for (let f = 0; f <= FRETS; f++) {
        const note = (open + f) % 12;
        if (!scaleNotes.includes(note)) continue;
        const x = f === 0 ? left - 22 : left + fretW * (f - 0.5);
        const cls = note === root ? "root" : "note";
        svg += `<circle cx="${x}" cy="${y}" r="13" class="${cls}"/>`;
        svg += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" class="lbl" font-weight="bold">${NOTES[note]}</text>`;
      }
    });

    const el = document.getElementById("fretboard");
    el.setAttribute("width", width);
    el.setAttribute("height", height);
    el.innerHTML = svg;
  }

  makeButtons();
  draw();
</script>
